[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prusa-unifi-cam"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["av>=14", "Pillow>=10"]

[tool.setuptools]
packages = ["bridge"]
package-dir = {bridge = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
